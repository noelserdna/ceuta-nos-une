<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Gironado: el motivo diagonal de la bandera de Ceuta.
       En oro sobre tinta, los colores del cartel. Antes iba en blanco y negro
       azulado, de cuando la web tenía otra paleta. -->
  <rect width="32" height="32" fill="#35101B"/>
  <g fill="#FCC018">
    <path d="M16 16 0 0h16z"/>
    <path d="M16 16 32 0v16z"/>
    <path d="M16 16 32 32H16z"/>
    <path d="M16 16 0 32V16z"/>
  </g>
</svg>
