<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · Ceuta nos une</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400..700&display=swap">
<link rel="stylesheet" href="/styles.css">
<style>
  .perdido {
    position: relative; isolation: isolate; overflow: hidden;
    min-height: 100dvh; display: grid; place-content: center; text-align: center;
    gap: 1.4rem; padding: 2rem; background: var(--papel); color: var(--tinta);
  }
  .perdido h1 {
    font-size: clamp(5rem, 26vw, 15rem); line-height: 0.85;
    color: var(--oro); -webkit-text-stroke: 0.05em var(--carmin);
    paint-order: stroke fill; transform: skewX(-5deg);
  }
  .perdido p { color: var(--gris); max-width: 40ch; margin: 0 auto; }
</style>
</head>
<body>
  <main class="perdido">
    <div class="trama" aria-hidden="true"></div>
    <h1>404</h1>
    <p>Esta página no existe, pero la plaza sigue en pie.</p>
    <p><a class="boton boton--brasa" href="/">Volver al mapa</a></p>
  </main>
</body>
</html>
